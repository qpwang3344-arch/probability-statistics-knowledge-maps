, "label": "毕业要求5\n职业规范 L", "group": "毕业要求", "level": 2, "detail": "数理统计对毕业要求5为低支撑：通过规范推断、统计法规意识和信息综合分析体现职业规范。"}, {"id": "ability_stat_thinking", "label": "统计思维", "group": "能力", "level": 2, "detail": "从样本认识总体，理解随机性、不确定性和推断边界。"}, {"id": "ability_inference", "label": "统计推断", "group": "能力", "level": 2, "detail": "参数估计、假设检验、区间估计是数理统计对专业能力的核心贡献。"}, {"id": "ability_decision", "label": "推断与决策", "group": "能力", "level": 2, "detail": "服务培养目标中统计推断与决策、大数据分析和行业数据问题解决。"}], "links": [{"source": "major", "target": "main_subjects", "label": "包含"}, {"source": "major", "target": "main_courses", "label": "设置"}, {"source": "main_courses", "target": "course", "label": "主干"}, {"source": "major", "target": "platform_prof", "label": "课程平台"}, {"source": "major", "target": "platform_foundation", "label": "课程平台"}, {"source": "major", "target": "platform_practice", "label": "课程平台"}, {"source": "platform_prof", "target": "module_core", "label": "必修"}, {"source": "platform_prof", "target": "module_elective", "label": "选修"}, {"source": "platform_prof", "target": "module_feature", "label": "必修"}, {"source": "module_core", "target": "course", "label": "核心必修"}, {"source": "platform_foundation", "target": "math_analysis", "label": "基础"}, {"source": "platform_foundation", "target": "linear_algebra", "label": "基础"}, {"source": "platform_foundation", "target": "probability", "label": "直接先修"}, {"source": "platform_foundation", "target": "programming", "label": "工具"}, {"source": "platform_foundation", "target": "economics", "label": "场景"}, {"source": "math_analysis", "target": "course", "label": "支撑"}, {"source": "linear_algebra", "target": "course", "label": "支撑"}, {"source": "probability", "target": "course", "label": "先修"}, {"source": "programming", "target": "course", "label": "工具支撑"}, {"source": "economics", "target": "course", "label": "应用背景"}, {"source": "course", "target": "sampling", "label": "支撑"}, {"source": "course", "target": "regression", "label": "支撑"}, {"source": "course", "target": "multivariate", "label": "支撑"}, {"source": "course", "target": "time_series", "label": "支撑"}, {"source": "course", "target": "stochastic", "label": "延伸"}, {"source": "course", "target": "machine_learning", "label": "迁移"}, {"source": "course", "target": "data_mining", "label": "迁移"}, {"source": "module_elective", "target": "nonparam", "label": "选修"}, {"source": "module_elective", "target": "bayes", "label": "选修"}, {"source": "module_elective", "target": "financial_stat", "label": "选修"}, {"source": "module_elective", "target": "econometrics", "label": "选修"}, {"source": "module_elective", "target": "market", "label": "选修"}, {"source": "module_elective", "target": "visualization", "label": "选修"}, {"source": "course", "target": "nonparam", "label": "方法拓展"}, {"source": "course", "target": "bayes", "label": "方法拓展"}, {"source": "course", "target": "financial_stat", "label": "领域应用"}, {"source": "course", "target": "econometrics", "label": "领域应用"}, {"source": "course", "target": "market", "label": "调查应用"}, {"source": "course", "target": "visualization", "label": "表达应用"}, {"source": "platform_practice", "target": "practice_skill", "label": "实践"}, {"source": "platform_practice", "target": "practice_internship", "label": "实践"}, {"source": "platform_practice", "target": "thesis", "label": "综合"}, {"source": "course", "target": "practice_skill", "label": "转化"}, {"source": "course", "target": "practice_internship", "label": "应用"}, {"source": "course", "target": "thesis", "label": "综合运用"}, {"source": "course", "target": "grad1", "label": "H"}, {"source": "course", "target": "grad2", "label": "H"}, {"source": "course", "target": "grad4", "label": "M"}, {"source": "course", "target": "grad5", "label": "L"}, {"source": "course", "target": "ability_stat_thinking", "label": "形成"}, {"source": "course", "target": "ability_inference", "label": "核心"}, {"source": "course", "target": "ability_decision", "label": "服务"}, {"source": "ability_stat_thinking", "target": "grad1", "label": "支撑"}, {"source": " const svg = document.getElementById('graph');

let transform = {x: 0, y: 0, k: 1};

};
const nodes = graph.nodes.map((d, i) => {

  const ring = d.level === 0 ? (d.id === 'major' ? 170 : 0) : 175 + d.level * 95 + (i % 4) * 14;

});
const byId = new Map(nodes.map(d => [d.id, d]));
const links = graph.links.map(l => ({...l, source: byId.get(l.source), target: byId.get(l.target)})).filter(l => l.source && l.target);

});
const labelEls = links.map(l => {

function shortLines(label) {
  return String(label).split('\n').flatMap(s => {

  }).slice(0, 3);
}
const nodeEls = nodes.map(n => {

  return g;
});
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

}
let dragging = null;
function pointerToGraph(e) { const rect = svg.getBoundingClientRect(); return {x:(e.clientX-rect.left-transform.x)/transform.k, y:(e.clientY-rect.top-transform.y)/transform.k}; }
function startDrag(e, n, el) { dragging = {node:n, id:e.pointerId}; el.setPointerCapture(e.pointerId); n.fx=n.x; n.fy=n.y; e.stopPropagation(); }
let panning = false, panStart = null;
svg.addEventListener('pointerdown', e => { if(e.target === svg) { panning=true; panStart={x:e.clientX,y:e.clientY,tx:transform.x,ty:transform.y}; } });
svg.addEventListener('pointermove', e => {
  if (dragging) { const p=pointerToGraph(e); dragging.node.x=p.x; dragging.node.y=p.y; dragging.node.fx=p.x; dragging.node.fy=p.y; dragging.node.vx=0; dragging.node.vy=0; }
  else if (panning) { transform.x = panStart.tx + e.clientX - panStart.x; transform.y = panStart.ty + e.clientY - panStart.y; applyTransform(); }

function tick() {

    if(dist<min) { const f=(min-dist)*0.02; const fx=dx/dist*f, fy=dy/dist*f; a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy; }
  }
  for (const n of nodes) {
    if(n.fx != null) { n.x=n.fx; n.y=n.fy; continue; }
    const cx = n.id === 'course' ? width*.48 : width*.5;
    const cy = n.id === 'course' ? height*.50 : height*.5;
    n.vx += (cx-n.x)*0.00035; n.vy += (cy-n.y)*0.00035;
    n.vx *= .86; n.vy *= .86; n.x += n.vx; n.y += n.vy;
  }

}
function render() {
  links.forEach((l,i) => {
    linkEls[i].setAttribute('x1', l.source.x); linkEls[i].setAttribute('y1', l.source.y);
    linkEls[i].setAttribute('x2', l.target.x); linkEls[i].setAttribute('y2', l.target.y);
    labelEls[i].setAttribute('x', (l.source.x+l.target.x)/2); labelEls[i].setAttribute('y', (l.source.y+l.target.y)/2);
  });
  nodes.forEach((n,i) => nodeEls[i].setAttribute('transform', `translate(${n.x},${n.y})`));
}
document.getElementById('reset').onclick = () => { transform={x:0,y:0,k:1}; applyTransform(); };
document.getElementById('focus').onclick = () => { transform={x:width*.03,y:height*.02,k:.9}; applyTransform(); showPanel(byId.get('course')); };

</script>
